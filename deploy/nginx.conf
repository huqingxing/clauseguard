server {
    listen 80;
    # root 提到 server 级：管理端的 try_files 也要解析到同一个产物目录。
    root /usr/share/nginx/html;

    # 管理端是独立入口 admin.html（与用户端两套产物）。/admin 与 /admin/ 都映射过去，
    # 视图切换靠 hash（#eval），所以不需要额外的前端回退规则。
    location = /admin {
        try_files /admin.html =404;
    }

    location = /admin/ {
        try_files /admin.html =404;
    }

    # 用户端静态资源
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 统一走 Java；Python(8000) 不对外暴露
    location /api/ {
        proxy_pass http://java-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SSE 长连接：只有 /stream 这一条是长连接，必须与同前缀的普通请求分开。
    #
    # 为什么显式 proxy_http_version 1.1：nginx 对上游默认 HTTP/1.0，而 1.0 没有 chunked，
    # 响应边界只能靠「关闭连接」表达。SSE 恰恰是一条永不关闭的响应，于是「一条消息到齐了
    # 没有」这件事就退化成依赖两边 flush 实现的默契。本栈（Tomcat + proxy_buffering off）
    # 实测是 write-through、逐条到达（两组时序见本次提交信息），
    # 但换成 buffered writer 的上游、或前面再叠一层代理就会攒批。显式 1.1 把「逐条到达」
    # 从「碰巧上游愿意立刻写」变成协议保证——这是修不确定性，不是修一个已观测到的 bug。
    #
    # Connection '' 是配合 1.1 的必要条件：1.1 默认 keep-alive，而 SSE 本身永不结束，
    # 再叠一层到上游的 keep-alive 会让连接复用语义错乱。
    location ~ ^/api/v1/reviews/[^/]+/stream$ {
        proxy_pass http://java-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 同前缀下的普通请求（POST /approve、GET 结果、findings 分页）：默认 60s。
    # 不能沿用 SSE 的 3600s——一个卡住的审批 POST 会把 worker 占满一小时，
    # 而审批本身只是一次数据库写入，60 秒拿不到结果就该让客户端知道失败。
    location /api/v1/reviews/ {
        proxy_pass http://java-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
