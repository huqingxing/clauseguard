server {
    listen 80;
    # root 提到 server 级：管理端的 try_files 也要解析到同一个产物目录。
    root /usr/share/nginx/html;

    # 管理端是独立入口 admin.html（与用户端两套产物）。/admin 与 /admin/ 都映射过去，
    # 视图切换靠 hash（#eval），所以不需要额外的前端回退规则。
    location = /admin {
        try_files /admin.html =404;
    }

    location = /admin/ {
        try_files /admin.html =404;
    }

    # 用户端静态资源
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 统一走 Java；Python(8000) 不对外暴露
    location /api/ {
        proxy_pass http://java-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SSE 长连接：关闭缓冲，防止事件被 nginx 攒批
    location /api/v1/reviews/ {
        proxy_pass http://java-service:8080;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
