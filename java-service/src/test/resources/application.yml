# 测试切片环境：关闭 MCP 与数据类自动配置，保证无 MySQL/Redis 也能启动 web 上下文
spring:
  ai:
    mcp:
      server:
        enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# 与主配置的演示账号一致：AdminControllerTest 用 httpBasic 走一遍真实认证链路，
# 只靠 @WithMockUser 无法证明账号来源与 BCrypt 编码是通的。
clauseguard:
  review:
    # @Scheduled 在测试里会跟着时钟乱跑：靠配置关掉，而不是让用例睡 5 分钟等它
    watchdog:
      enabled: false
  security:
    users:
      - username: user
        password: user123
        role: USER
      - username: admin
        password: admin123
        role: ADMIN
