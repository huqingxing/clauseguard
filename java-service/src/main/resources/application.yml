# 端口与库名来自版本表，不得改动
server:
  port: 8080

spring:
  application:
    name: clauseguard-java
  # 唯一 MySQL 访问方：schema 由 Flyway 拥有，JPA 不自动建表
  datasource:
    url: jdbc:mysql://localhost:3306/clauseguard?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: clauseguard
    password: ${MYSQL_PASSWORD:clauseguard}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  # 事件重放存储（断线续传）：默认 Redis Stream，保留最近 1000 条
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  ai:
    mcp:
      server:
        enabled: true
        name: clauseguard-mcp
        version: 0.1.0
        # SSE over WebMvc：MCP Inspector 连接 http://localhost:8080/mcp/sse
        # 切换 stdio 传输：--spring.ai.mcp.server.transport=STDIO --spring.main.web-application-type=none
        transport: WEBMVC

# 下游 Python 编排服务（SSE 网关转发目标）
clauseguard:
  python:
    base-url: http://localhost:8000
    # 下游 SSE 调用整体超时；超时才触发熔断计数
    connect-timeout: 5s
    response-timeout: 30s
  # 事件重放存储实现：redis（默认）| in-memory（本地无 Redis 时）
  event-store: redis

# 下游 Python 熔断：连续失败打开后，/stream 直接返回 503 且可重试
resilience4j:
  circuitbreaker:
    instances:
      pythonAgent:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  # Stage 14：OTel 追踪。默认关闭——本地 mvn test / 无 collector 的演示不该产生
  # 后台上报噪声；打开方式：CLAUSEGUARD_TRACING_ENABLED=true。
  tracing:
    enabled: ${CLAUSEGUARD_TRACING_ENABLED:false}
    sampling:
      probability: ${CLAUSEGUARD_TRACE_SAMPLING:1.0}
  otlp:
    tracing:
      # Langfuse：<host>/api/public/otel/v1/traces（Basic 认证头见 headers）；
      # 本地 OTel Collector：http://localhost:4318/v1/traces。
      endpoint: ${CLAUSEGUARD_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
      headers:
        Authorization: ${CLAUSEGUARD_OTLP_AUTHORIZATION:}
