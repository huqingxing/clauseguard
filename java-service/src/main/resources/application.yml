# 端口与库名来自版本表，不得改动
server:
  port: 8080

spring:
  application:
    name: clauseguard-java
  # 唯一 MySQL 访问方：schema 由 Flyway 拥有，JPA 不自动建表
  datasource:
    url: jdbc:mysql://localhost:3306/clauseguard?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: clauseguard
    password: ${MYSQL_PASSWORD:clauseguard}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  # 事件重放存储（断线续传）：默认 Redis Stream，保留最近 1000 条
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  ai:
    mcp:
      server:
        enabled: true
        name: clauseguard-mcp
        version: 0.1.0
        # SSE over WebMvc：MCP Inspector 连接 http://localhost:8080/mcp/sse
        # 切换 stdio 传输：--spring.ai.mcp.server.transport=STDIO --spring.main.web-application-type=none
        transport: WEBMVC

# 下游 Python 编排服务（SSE 网关转发目标）
clauseguard:
  python:
    base-url: http://localhost:8000
    # 下游 SSE 调用整体超时；超时才触发熔断计数
    connect-timeout: 5s
    response-timeout: 30s
  review:
    # 看门狗（Stage 14）：把「长时间没有任何事件的 RUNNING」自动收敛到 FAILED。
    # 根因是「状态先落 RUNNING，再去开事件流」——流断了状态就永远停在 RUNNING，
    # 只能靠人发现 + 一次性 SQL 处理（Redis 降级那次留下过 6 条）。
    watchdog:
      enabled: ${CLAUSEGUARD_WATCHDOG_ENABLED:true}
      # 超时阈值按「最长真实审查耗时」定，宁大勿小：判早了会把还在推进的大合同误杀成 FAILED，
      # 而判晚了只是晚一点收敛。30m 对本机 mock 审查（数十秒量级）留了两个数量级余量。
      # 不要为了「快」把它调到 5 分钟这种激进值。
      timeout: 30m
      # 扫描间隔：远小于 timeout，保证卡死的审查最多多等一个 interval 就被回收。
      interval: 5m
  # 事件重放存储实现：redis（默认，需 Redis ≥ 5.0 的 Streams）| in-memory（仅故障降级用：
  # 进程内 Map，重启即丢，断线续传失效，不要写进任何启动脚本当默认）
  event-store: redis
  # 管理端账号：演示用，生产必须换（换成外部用户源或至少换成 BCrypt hash + 密钥管理）。
  # 密码在启动时用 BCrypt 编码后才进内存，配置里保留明文只是为了让本机能直接 curl 验证。
  security:
    users:
      - username: user
        password: user123
        role: USER
      - username: admin
        password: admin123
        role: ADMIN

# 下游 Python 熔断：连续失败打开后，/stream 直接返回 503 且可重试
resilience4j:
  circuitbreaker:
    instances:
      pythonAgent:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  # Stage 14：OTel 追踪。默认关闭——本地 mvn test / 无 collector 的演示不该产生
  # 后台上报噪声；打开方式：CLAUSEGUARD_TRACING_ENABLED=true。
  tracing:
    enabled: ${CLAUSEGUARD_TRACING_ENABLED:false}
    sampling:
      probability: ${CLAUSEGUARD_TRACE_SAMPLING:1.0}
  otlp:
    tracing:
      # Langfuse：<host>/api/public/otel/v1/traces（Basic 认证头见 headers）；
      # 本地 OTel Collector：http://localhost:4318/v1/traces。
      endpoint: ${CLAUSEGUARD_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
      headers:
        Authorization: ${CLAUSEGUARD_OTLP_AUTHORIZATION:}
