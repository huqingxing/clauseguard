[project]
name = "clauseguard-agent"
version = "0.1.0"
description = "ClauseGuard 编排与推理服务：LangGraph 多智能体审查"
requires-python = ">=3.12,<3.13"
dependencies = [
    # 版本表锁定，升级需走 ADR
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "langchain>=1.0,<2",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=2",
    "psycopg[binary,pool]>=3.2",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "lxml>=5",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "pytest>=8.3",
    "httpx>=0.28",
    # Stage 2 契约生成与校验：datamodel-code-generator 从 events.schema.json 产出 pydantic 模型；
    # jsonschema 用于 test_contract.py 严格校验 examples。
    "datamodel-code-generator>=0.25,<0.28",
    "jsonschema>=4.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
# 生成代码（datamodel-code-generator 产出）只读、禁止手改，不纳入项目风格检查。
extend-exclude = ["app/contracts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "T20"]  # T20: 禁止裸 print

[tool.mypy]
python_version = "3.12"
strict = true
# 生成代码（datamodel-code-generator 产出，含 conint/confloat 调用式注解）只读、禁止手改，
# 不纳入项目类型检查。
exclude = "app/contracts"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
