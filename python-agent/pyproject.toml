[project]
name = "clauseguard-agent"
version = "0.1.0"
description = "ClauseGuard 编排与推理服务：LangGraph 多智能体审查"
requires-python = ">=3.12,<3.13"
dependencies = [
    # 版本表锁定，升级需走 ADR
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "langchain>=1.0,<2",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=2",
    "psycopg[binary,pool]>=3.2",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "lxml>=5",
    # Stage 6：OpenAI 兼容聊天模型（app/clients/openai_compat.py）的 HTTP 客户端；
    # 原在 dev 组（TestClient 用），现运行时需要，提为运行时依赖（非新增依赖）。
    "httpx>=0.28",
    # Stage 14：可观测性（任务书明确要求 OTel → Langfuse OTLP）。仅 sdk + OTLP/HTTP
    # exporter 两个包，不引自动埋点 instrumentation（节点 span 由 app/observability 显式建）。
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
    # 检索实验台阶段 2：jieba 中文分词 + BM25Okapi 稀疏召回；numpy 本就在
    # 依赖图内（rank_bm25 依赖它），显式声明以锁定版本口径。
    "jieba>=0.42,<0.43",
    "rank-bm25>=0.2,<0.3",
    "numpy>=2,<3",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "pytest>=8.3",
    "httpx>=0.28",
    # Stage 2 契约生成与校验：datamodel-code-generator 从 events.schema.json 产出 pydantic 模型；
    # jsonschema 用于 test_contract.py 严格校验 examples。
    "datamodel-code-generator>=0.25,<0.28",
    "jsonschema>=4.21",
    # Stage 14：压测（deploy/locust/locustfile.py），只跑压测时安装。
    "locust>=2.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# retrieval 与语料快照必须随服务一起打包：后续索引/评测入口在运行时 import retrieval，
# 只声明 app 会让 wheel 装着「能跑的 Agent」却缺「检索实验台的语料与切分器」。
packages = ["app", "retrieval"]

[tool.ruff]
line-length = 100
target-version = "py312"
# 生成代码（datamodel-code-generator 产出）只读、禁止手改，不纳入项目风格检查。
extend-exclude = ["app/contracts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "T20"]  # T20: 禁止裸 print

[tool.mypy]
python_version = "3.12"
strict = true
# 生成代码（datamodel-code-generator 产出，含 conint/confloat 调用式注解）只读、禁止手改，
# 不纳入项目类型检查。
exclude = "app/contracts"

# lxml 无类型 stub 包且版本表不外扩依赖（铁律 5）：按缺失导入放行，
# docx_writer 内部对 lxml 的用法集中在少数私有函数，边界处已显式标注。
[[tool.mypy.overrides]]
module = "lxml.*"
ignore_missing_imports = true

# jieba / rank_bm25 是纯 Python 包且不带 py.typed（阶段 2 允许新增的两个依赖）。
# 版本表不外扩 stub 依赖，按缺失导入放行；调用面只有 tokenize 与 BM25Okapi 两处。
[[tool.mypy.overrides]]
module = ["jieba.*", "rank_bm25.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
